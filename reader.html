<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перегляд документа — Руслана Заяць</title><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="styles.css">
<style>
.reader-wrap{padding:34px 0 60px}.reader-card{max-width:760px;margin:0 auto;padding:28px;border:1px solid #d9e2e8;border-radius:22px;background:#fff;box-shadow:0 16px 40px rgba(16,40,60,.08)}.reader-icon{font-size:2.4rem}.reader-title{margin:10px 0 8px}.reader-note{color:#657582}.reader-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.reader-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;background:#173f63;color:#fff;text-decoration:none;font-weight:700}.reader-btn.secondary{background:#eef4f7;color:#173f63}.reader-status{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f7f3ec;color:#6b5a41}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">РЗ</span><span><strong>Руслана Заяць</strong><small>навчально-методичний простір</small></span></a><nav class="nav"><a href="index.html">Головна</a><a href="index.html#students">Для студентів</a><a href="portfolio.html">Портфоліо</a></nav></div></header>
<main class="reader-wrap"><div class="container"><div class="reader-card"><div class="reader-icon">📄</div><h1 id="title" class="reader-title">Перегляд документа</h1><p class="reader-note">Документ відкривається у режимі перегляду без інструментів редагування.</p><div id="status" class="reader-status">Відкриваю файл для читання…</div><div class="reader-actions"><a id="open" class="reader-btn" href="#">Відкрити файл для читання →</a><a id="back" class="reader-btn secondary" href="index.html#students">← Назад до матеріалів</a></div></div></div></main>
<footer class="site-footer"><div class="container footer-inner"><span>© 2026 Руслана Заяць</span><span>Перегляд навчального матеріалу</span></div></footer>
<script>
(function(){
 const q=new URLSearchParams(location.search), id=q.get('id'), kind=(q.get('kind')||'file').toLowerCase(), title=q.get('title')||'Перегляд документа', back=q.get('back')||'index.html#students';
 const titleEl=document.getElementById('title'), open=document.getElementById('open'), backEl=document.getElementById('back'), status=document.getElementById('status');
 titleEl.textContent=title; document.title=title+' — Руслана Заяць'; backEl.href=back;
 if(!id||!/^[A-Za-z0-9_-]+$/.test(id)){status.textContent='Документ не знайдено. Поверніться до попередньої сторінки.';open.style.display='none';return;}
 let src;
 if(kind==='doc'||kind==='document') src='https://docs.google.com/document/d/'+id+'/preview';
 else if(kind==='slides'||kind==='presentation') src='https://docs.google.com/presentation/d/'+id+'/preview';
 else if(kind==='sheet'||kind==='spreadsheet') src='https://docs.google.com/spreadsheets/d/'+id+'/preview';
 else src='https://drive.google.com/file/d/'+id+'/preview';
 open.href=src; open.rel='noopener';
 status.textContent='Якщо файл не відкрився автоматично, натисніть «Відкрити файл для читання».';
 setTimeout(function(){ location.href=src; },350);
})();
</script>
</body></html>
