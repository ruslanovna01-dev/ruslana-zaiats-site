<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перегляд документа — Руслана Заяць</title><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="styles.css">
<style>
.reader-wrap{padding:26px 0 50px}.reader-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.reader-frame{width:100%;height:78vh;min-height:620px;border:1px solid #d9e2e8;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(16,40,60,.08)}.reader-note{font-size:.92rem;color:#657582}.reader-title{margin:4px 0 0}.reader-back{font-weight:700;text-decoration:none;color:#173f63}.reader-error{padding:30px;border:1px solid #e3d9cb;border-radius:18px;background:#fffaf3}
@media(max-width:700px){.reader-frame{height:72vh;min-height:500px}}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">РЗ</span><span><strong>Руслана Заяць</strong><small>навчально-методичний простір</small></span></a><nav class="nav"><a href="index.html">Головна</a><a href="index.html#students">Для студентів</a><a href="portfolio.html">Портфоліо</a></nav></div></header>
<main class="reader-wrap"><div class="container"><div class="reader-bar"><div><a id="back" class="reader-back" href="index.html#students">← Назад</a><h1 id="title" class="reader-title">Перегляд документа</h1><div class="reader-note">Режим читання. Редагування на сайті не передбачено.</div></div></div><div id="host"></div></div></main>
<footer class="site-footer"><div class="container footer-inner"><span>© 2026 Руслана Заяць</span><span>Перегляд навчального матеріалу</span></div></footer>
<script>
(function(){
 const q=new URLSearchParams(location.search), id=q.get('id'), kind=(q.get('kind')||'file').toLowerCase(), title=q.get('title')||'Перегляд документа', back=q.get('back')||'index.html#students';
 document.getElementById('title').textContent=title; document.title=title+' — Руслана Заяць'; document.getElementById('back').href=back;
 const host=document.getElementById('host');
 if(!id||!/^[A-Za-z0-9_-]+$/.test(id)){host.innerHTML='<div class="reader-error"><b>Документ не знайдено.</b><p>Поверніться до попередньої сторінки та відкрийте матеріал ще раз.</p></div>';return;}
 let src;
 if(kind==='doc'||kind==='document') src='https://docs.google.com/document/d/'+id+'/preview';
 else if(kind==='slides'||kind==='presentation') src='https://docs.google.com/presentation/d/'+id+'/preview';
 else if(kind==='sheet'||kind==='spreadsheet') src='https://docs.google.com/spreadsheets/d/'+id+'/preview';
 else src='https://drive.google.com/file/d/'+id+'/preview';
 const f=document.createElement('iframe'); f.className='reader-frame'; f.src=src; f.loading='eager'; f.allowFullscreen=true; f.referrerPolicy='no-referrer-when-downgrade'; f.title=title; host.appendChild(f);
})();
</script>
</body></html>
