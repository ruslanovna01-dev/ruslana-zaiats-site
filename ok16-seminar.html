<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОК16 — Семінар</title><link rel="stylesheet" href="styles.css"><style>.doc-wrap{padding:30px 0 60px}.paper{max-width:900px;margin:0 auto;background:#fff;border:1px solid #dde5ea;border-radius:22px;box-shadow:0 18px 48px rgba(16,40,60,.08);padding:clamp(24px,5vw,54px)}.doc-section{margin:28px 0}.doc-section li,.doc-section p{line-height:1.7}.doc-note{margin-top:20px;padding:14px 16px;border-radius:14px;background:#f7f3ec;color:#6b5a41}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">РЗ</span><span><strong>Руслана Заяць</strong><small>навчально-методичний простір</small></span></a><nav class="nav"><a href="ok16.html">ОК16</a><a href="ok16-seminars.html">Семінари</a><a href="ok16-lectures.html">Лекції</a></nav></div></header><main class="doc-wrap"><div class="container"><article class="paper"><a class="back-link" href="ok16-seminars.html">← До семінарів</a><span class="eyebrow">ОК16 • Семінарське заняття • режим читання</span><h1 id="title">Семінар</h1><section class="doc-section"><h2>Мета</h2><p id="goal"></p></section><section class="doc-section"><h2>Питання для обговорення</h2><ol id="questions"></ol></section><section class="doc-section"><h2>Технологічні приклади</h2><p id="examples"></p></section><div class="doc-note">Матеріал доступний для читання без редагування.</div></article></div></main><footer class="site-footer"><div class="container footer-inner"><span>© 2026 Руслана Заяць</span><span>ОК16 • Семінари</span></div></footer><script>const d={1:{t:'СЕМ_01. Риба і морепродукти',g:'Закріпити технологічну логіку приготування страв з риби та морепродуктів і навчитися аналізувати якість та типові дефекти.',q:['Особливості варіння, припускання і смаження риби','Добір соусів і гарнірів','Ознаки готовності та збереження соковитості','Типові дефекти і дії технолога'],e:'Риба відварна з польським соусом, риба припущена з голландським соусом, креветки з рисом.'},2:{t:'СЕМ_02. М’ясо, субпродукти, птиця',g:'Закріпити вибір способів теплової обробки для різних видів м’ясної сировини та аналіз якості готових страв.',q:['Вибір частини туші та способу обробки','Контроль соковитості й готовності','Особливості субпродуктів','Порціонування та подавання'],e:'Бефстроганов, біфштекс натуральний, печінка по-строгановськи, курка відварна з білим соусом, кролик тушкований у сметанному соусі.'},3:{t:'СЕМ_03. Холодні та солодкі страви',g:'Систематизувати вимоги до безпечності, структури, оформлення та реалізації холодних і солодких страв.',q:['Санітарні вимоги до холодних страв','Оформлення і заправлення','Желювання та загущення','Температура й строки реалізації'],e:'Вінегрет овочевий, риба заливна, паштет печінковий, кисіль плодово-ягідний, желе фруктове, суфле ванільне.'},4:{t:'СЕМ_04. Дієтичне та дитяче харчування',g:'Закріпити принципи щадної кулінарної обробки, безпечності та адаптації страв до дієтичного й дитячого харчування.',q:['Щадні способи обробки','Обмеження солі, жиру та гострих компонентів','Порціонування дитячих страв','Алергени та перехресний контакт'],e:'Котлета парова з м’яса, морквяне суфле з сиром.'}};let n=parseInt(new URLSearchParams(location.search).get('n')||'1',10);if(!d[n])n=1;let x=d[n];document.getElementById('title').textContent=x.t;document.getElementById('goal').textContent=x.g;document.getElementById('examples').textContent=x.e;x.q.forEach(v=>{let li=document.createElement('li');li.textContent=v;document.getElementById('questions').appendChild(li)});</script></body></html>
