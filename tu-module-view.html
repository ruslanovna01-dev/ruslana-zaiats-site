<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТУ — матеріали модуля</title><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><style>.module-reader{padding:34px 0 55px}.module-head{margin-bottom:24px}.module-head h1{margin:.3rem 0}.file-group,.folder-view{margin:18px 0;border:1px solid #dbe5ea;border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 12px 32px rgba(16,40,60,.06)}.file-group h2{margin:0;padding:18px 20px;font-size:1.05rem;color:#173f63;border-bottom:1px solid #e1e8ec}.file-list{display:grid}.file-link{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;text-decoration:none;color:#173f63;border-bottom:1px solid #eef2f4;font-weight:700}.file-link:last-child{border-bottom:0}.file-link:hover{background:#f6fafb}.file-link small{font-weight:700;color:#74828b}.folder-view summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;font-weight:800;color:#173f63}.folder-view summary::-webkit-details-marker{display:none}.folder-view summary span:last-child{font-size:.9rem;font-weight:700;color:#74828b}.folder-view iframe{display:block;width:100%;height:560px;border:0;border-top:1px solid #e1e8ec;background:#fff}.module-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}.module-nav a{padding:11px 15px;border-radius:12px;background:#173f63;color:#fff;text-decoration:none;font-weight:700}.module-nav a.secondary{background:#edf3f6;color:#173f63}@media(max-width:700px){.folder-view iframe{height:500px}.file-link{flex-direction:column;gap:4px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">РЗ</span><span><strong>Руслана Заяць</strong><small>навчально-методичний простір</small></span></a><nav class="nav"><a href="tu.html">← ТУ</a><a href="ok16.html">ОК16</a><a href="ok17.html">ОК17</a><a href="portfolio.html">Портфоліо</a></nav></div></header><main class="module-reader"><div class="container"><div class="module-head"><a class="back-link" href="tu.html">← Усі модулі ТУ</a><span class="eyebrow" id="kicker">ТУ • навчальний модуль</span><h1 id="title">Навчальні матеріали</h1><p id="hint">Оберіть конкретний файл Google Drive.</p></div><div id="folders"></div><div class="module-nav"><a id="prev" class="secondary" href="tu.html">← Попередній</a><a href="tu.html" class="secondary">Усі 13 модулів</a><a id="next" href="tu.html">Наступний →</a></div></div></main><footer class="site-footer"><div class="container footer-inner"><span>© 2026 Руслана Заяць</span><span>ТУ</span></div></footer><script src="tu-data.js"></script><script>(function(){const T=window.TU_T||{},D=window.TU_D||{},F=window.TU_F||{};let n=parseInt(new URLSearchParams(location.search).get('m')||'1',10);if(!T[n])n=1;document.getElementById('kicker').textContent='ТУ • Модуль '+n;document.getElementById('title').textContent=T[n];document.title='Модуль '+n+' — '+T[n]+' | Руслана Заяць';const h=document.getElementById('folders');if(D[n]){D[n].forEach(g=>{const box=document.createElement('section');box.className='file-group';const h2=document.createElement('h2');h2.textContent=g[0];box.appendChild(h2);const list=document.createElement('div');list.className='file-list';g[1].forEach(x=>{const a=document.createElement('a');a.className='file-link';a.href='https://drive.google.com/file/d/'+x[1]+'/view';a.target='_blank';a.rel='noopener';a.innerHTML='<span>'+x[0]+'</span><small>'+x[2]+' • перегляд ↗</small>';list.appendChild(a)});box.appendChild(list);h.appendChild(box)})}else{document.getElementById('hint').textContent='Оберіть потрібний вид матеріалів, а потім конкретний файл Google Drive.';(F[n]||[]).forEach((a,i)=>{const d=document.createElement('details');d.className='folder-view';if(i===0)d.open=true;const s=document.createElement('summary');s.innerHTML='<span>'+a[0]+'</span><span>відкрити ▾</span>';const f=document.createElement('iframe');f.src='https://drive.google.com/embeddedfolderview?id='+a[1]+'#list';f.loading=i===0?'eager':'lazy';f.title=a[0]+' — модуль '+n;d.appendChild(s);d.appendChild(f);h.appendChild(d)})}const p=document.getElementById('prev'),q=document.getElementById('next');if(n>1)p.href='tu-module-view.html?m='+(n-1);else{p.href='tu.html';p.textContent='← До списку модулів'}if(n<13)q.href='tu-module-view.html?m='+(n+1);else{q.href='tu.html';q.textContent='До списку модулів →'}})();</script></body></html>
