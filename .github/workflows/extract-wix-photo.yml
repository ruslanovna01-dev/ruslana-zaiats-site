name: Extract Wix photo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-wix-photo.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wix page and extract image URLs
        run: |
          python - <<'PY'
          import re, html, urllib.request, json
          url='https://zaiatsruslana.wixsite.com/confectioner/golovna'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','ignore')
          open('wix-page.html','w',encoding='utf-8').write(data)
          urls=[]
          for m in re.findall(r'https?://[^\"\'<> ]+', data):
              m=html.unescape(m).replace('\\u002F','/').replace('\\/','/')
              if 'wixstatic.com/media/' in m or 'static.wixstatic.com/media/' in m:
                  urls.append(m)
          # Also inspect escaped JSON fragments
          for m in re.findall(r'https?:\\/\\/[^\"\']+', data):
              m=html.unescape(m).replace('\\/','/')
              if 'wixstatic.com/media/' in m:
                  urls.append(m)
          clean=[]
          for u in urls:
              u=u.split('"')[0].split("'")[0]
              if u not in clean: clean.append(u)
          open('wix-assets.txt','w',encoding='utf-8').write('\n'.join(clean))
          # grab og:image if present
          og=re.findall(r'<meta[^>]+property=[\"\']og:image[\"\'][^>]+content=[\"\']([^\"\']+)', data, re.I)
          open('wix-og-image.txt','w',encoding='utf-8').write('\n'.join(og))
          print('found', len(clean), 'media urls; og', og[:3])
          PY
      - name: Commit extracted URL list
        run: |
          git config user.name 'ruslanovna01-dev'
          git config user.email 'ruslanovna01@gmail.com'
          git add wix-assets.txt wix-og-image.txt
          git commit -m 'Extract Wix image references' || exit 0
          git push
