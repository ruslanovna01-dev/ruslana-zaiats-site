name: Add award descriptions
on:
  push:
    paths:
      - '.github/workflows/add-award-descriptions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add concise descriptions under awards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html
          p=Path('portfolio.html')
          s=p.read_text(encoding='utf-8')

          card_notes={
          '1LP_bK197qnDeA0dpQDrYRrEmfXDDEwe5':'Участь у семінарі «Впровадження інновацій в освітній процес» (29.10.2025). Захід був спрямований на ознайомлення педагогів із сучасними підходами та інноваційними інструментами для освітньої практики.',
          '1MzInstL44oHEkX2rR1zQbjnuXO0nuS0N':'Подяка освітнього проєкту «Всеосвіта» за професійну активність і участь у педагогічній спільноті. Відзнака є підтвердженням професійної залученості.',
          '1l_nrLflmCT8FuPNLLo_yl5FaWQdVL5Jt':'Документ професійного портфоліо за 2025 рік. Підтверджує участь у фаховій діяльності та професійному розвитку.',
          '1XlVaS3XmYiO67iAJalMm7_fASWwp2AgH':'Професійний сертифікат 2025 року. Документ засвідчує участь у професійному розвитку та використовується як підтвердження результатів міжатестаційного періоду.',
          '1hxk2FqPgq1tVqtpgWbxa9_k58LdVSCoh':'Професійна відзнака 2025 року, що документує участь у фаховій діяльності та педагогічних ініціативах.',
          '11GSLekueHt2s_pZmgkcadXWBPU7PG_4c':'Професійна відзнака 2025 року. Представлена у портфоліо як документальне підтвердження професійної активності.',
          '1RR9OVhTKUA0pRoVf4sAjnBj0vDHvtqXW':'Сертифікат / відзнака 2025 року, пов’язана з професійним розвитком і участю в освітній діяльності.',
          '1FCr_78ijfbMXuQ3NS7JLO-vL7gFohrOC':'Сертифікат / відзнака 2025 року. Підтверджує професійну активність і поповнює доказову базу педагогічного портфоліо.',
          '152GHqs0GCDyPZHsfEB_iHTjybDsS73uH':'Сертифікат підвищення кваліфікації за 2025 рік. Документ підтверджує опрацювання актуальної освітньої тематики та професійне вдосконалення.',
          '1Q1XHjVvFcYiO9bI5WGYtb0ltDJazrNla':'Сертифікат професійного розвитку за 2025 рік. Засвідчує участь у навчанні та оновленні професійних компетентностей.',
          '1gvf962s7KyIVjY1B-0l86DpZbJSGJq_p':'Професійна відзнака 2025 року, що фіксує результат участі у фаховій та освітній діяльності.',
          '1ZONtwhjDDSXVpFt_Pz5Hu2yvf96Vd5vH':'Документ професійного портфоліо за 2025 рік. Підтверджує професійний розвиток і участь у педагогічній діяльності.',
          '1XGvflk1_5taB25sihmHBI_2UNeug3joa':'Документ професійного портфоліо за 2025 рік. Зберігається як підтвердження професійної активності та результатів роботи.',
          '1V4eturc9ZyQpmWfJqyGNosv1wjWbQhP6':'Сертифікат професійного розвитку за 2024 рік. Документ підтверджує підвищення кваліфікації та опрацювання сучасних підходів в освіті.',
          '1sVLyytxRvo_pcsxL0bi-sxkyvwdb1AcB':'Професійний сертифікат 2023 року. Підтверджує участь у професійному навчанні та розвиток педагогічних компетентностей.',
          '1NvHUuUcCALZLkbb2tKqQ_t8JyZdmNvvz':'Професійний сертифікат 2023 року. Документ засвідчує участь у фаховому розвитку та освітній діяльності.',
          '1Y4xkr33y0meavQEISgr2PVkoZZD9j2-_':'Диплом / професійна відзнака 2023 року. Фіксує результат участі у фаховому заході або професійному конкурсі.',
          '1rA9Pfu26uP8lQ_VKfPbXRCZJn2zJcsf8':'Диплом / сертифікат 2023 року. Представлений як підтвердження професійного досягнення та участі у фаховій діяльності.',
          '1JUwT5mGWf8LuSjbsdM7tmoETBi5E5adE':'Матеріал про професійне досягнення 2023 року. Документує участь у професійній діяльності та результат, включений до портфоліо.',
          '1oSmDaY26KUYtbDg-EMiMXtjwZMoLupn3':'Сертифікат / професійна відзнака 2023 року. Підтверджує професійну активність і розвиток педагогічної майстерності.'
          }

          for fid,note in card_notes.items():
              pat=re.compile(r'(<a class="award-card"[^>]*href="https://drive\.google\.com/file/d/'+re.escape(fid)+r'/view".*?<div class="award-info">)(.*?)(</div></a>)',re.S)
              m=pat.search(s)
              if not m: continue
              body=m.group(2)
              esc=html.escape(note, quote=False)
              if 'class="award-note"' in body:
                  body=re.sub(r'<p class="award-note">.*?</p>',f'<p class="award-note">{esc}</p>',body,flags=re.S)
              else:
                  body=body.replace('<span class="award-action">',f'<p class="award-note">{esc}</p><span class="award-action">',1)
              s=s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():]

          file_updates={
          '1w1kemCdqdFGm-wuMBr2LYH-vDYfX9Q0K':('Добірка сертифікатів професійного розвитку, 2025','Добірка документів про підвищення кваліфікації: інклюзивна освіта, управління якістю, застосування ШІ, академічна доброчесність і педагогіка партнерства.'),
          '1HAsaZhCtjU1cJyUZB4NPL5ixL_OGdXpI':('Інклюзивна освіта в умовах дистанційного та змішаного навчання','Курс «На Урок», 30 годин / 1 кредит ЄКТС. Практичні підходи до організації інклюзивного освітнього процесу, НУШ і роботи закладу освіти.'),
          '14TM3g4PDli28R_959baYrG_0AC8XzFti':('Управління якістю освіти: ключові аспекти','Підвищення кваліфікації ГО «Платформа ОСВІТИ», 30 годин / 1 кредит ЄКТС. Тема присвячена системам і практичним інструментам забезпечення якості освіти.'),
          '1z8uCdk1qRQcerVphJm07YnPIRImQ6tbr':('Академічна доброчесність: онлайн-курс для викладачів','Курс Prometheus, 60 годин / 2 кредити ЄКТС. Орієнтований на практичне застосування принципів академічної доброчесності у викладанні та педагогічному супроводі.'),
          '1poUz-bSVBO3e1KJukrhz2o5rwyiRMWAj':('Штучний інтелект в освітньому процесі','Підвищення кваліфікації за темою розвитку навичок роботи з ШІ та їх застосування в освіті, 30 годин / 1 кредит ЄКТС, 30.12.2024.'),
          '1TpSxArLHTBk-OXopkpph61frEmFC4vJv':('«Світ професій» — авторський матеріал «Технологія приготування листкового тіста»','Сертифікат Інституту професійних кваліфікацій про розміщення авторського навчального матеріалу на цифровій платформі «Світ професій», 16.11.2023.'),
          '11so-oY02LanTm-ICtPqy4Nv2Fz_oEYRv':('«Світ професій» — авторський матеріал з профорієнтації','Сертифікат про розміщення авторського матеріалу «Організація профорієнтаційної роботи у закладах професійної освіти з використанням сучасних технологій», 16.11.2023.'),
          '1NbEhfsKkQD_8TOFqkjERCKrsAsngSPIR':('Психоемоційний клімат під час освітнього процесу','Курс «На Урок» «Формування та відновлення психоемоційного клімату під час реалізації освітнього процесу», 30 годин / 1 кредит ЄКТС, 20.12.2023.'),
          '10OtVA5GQM-Xg6beUMeuCDs27dJ5uRISV':('Human Resources Management','Онлайн-модуль професійного розвитку з управління людськими ресурсами, 4 години. Завершений 29.12.2022.'),
          '1SkRsHL3xqTkhysfPE3_bATMWXrprKiRz':('Підвищення кваліфікації педагогічних працівників: нові вимоги і можливості','Курс Prometheus, 15 годин / 0,5 кредиту ЄКТС. Розвиток управлінських, лідерських, оцінювально-аналітичних та інформаційно-комунікаційних компетентностей.'),
          '1RBK4tvJQdWnKEgMlxhnlmvcYlaIR-TzY':('Методична розробка «Справа твого життя. Професія кухар; кондитер»','Сертифікат про публікацію методичної розробки виховної години на освітньому ресурсі «На Урок», 15.11.2022.'),
          '1f0byaNWoFoWcb_8lNX9dVG7cMHJu8oL9':('Методична розробка «Актуальність обраної професії КОНДИТЕР»','Сертифікат про публікацію авторської виховної години на ресурсі «На Урок», 15.11.2022.'),
          '1kh7xvBn8BFXr4Y9uDTlNYigvNO0MGvBn':('Методичні рекомендації: бездріжджові види тіста','Сертифікат про публікацію методичних рекомендацій для підготовки кондитерів 3 розряду на ресурсі «На Урок», 15.11.2022.'),
          '1n5Hpv6S82VxMXgbPyJ-tkLySJ_SCUdKj':('Методична розробка «Технологія приготування масляних кремів»','Сертифікат про публікацію авторського навчального матеріалу на ресурсі «На Урок», 15.11.2022.'),
          '1osuXwDmwJp8xZcVS9CqXUXlHaE-jL19j':('Методичні рекомендації до проведення тижня професії кухар; кондитер','Сертифікат про публікацію методичних рекомендацій на ресурсі «На Урок», 15.11.2022.')
          }

          for fid,(title,note) in file_updates.items():
              pat=re.compile(r'(<a class="award-file"[^>]*href="https://drive\.google\.com/file/d/'+re.escape(fid)+r'/view"[^>]*>.*?<span class="award-file-body"><strong>)(.*?)(</strong><span>)(.*?)(</span></span></a>)',re.S)
              m=pat.search(s)
              if not m: continue
              repl=m.group(1)+html.escape(title,quote=False)+m.group(3)+html.escape(note,quote=False)+m.group(5)
              s=s[:m.start()]+repl+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'site-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add portfolio.html
          git diff --cached --quiet || git commit -m 'Add descriptions under certificates and awards'
          git push
