name: Add homepage photo styles
on:
  push:
    paths:
      - .github/workflows/add-photo-styles.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append photo styles
        shell: bash
        run: |
          if ! grep -q 'HERO_PROFILE_PHOTO_V1' styles.css; then
            cat >> styles.css <<'EOF'

/* HERO_PROFILE_PHOTO_V1 */
.hero-photo-shell{position:relative;min-height:430px;display:flex;align-items:center;justify-content:center;padding:24px 18px 48px}.hero-photo-glow{position:absolute;width:88%;height:78%;border-radius:34px;background:linear-gradient(135deg,rgba(239,190,116,.28),rgba(108,201,199,.18));filter:blur(28px);transform:rotate(-5deg)}.hero-photo-frame{position:relative;z-index:2;width:min(100%,470px);aspect-ratio:4/3;border-radius:30px;overflow:hidden;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);box-shadow:0 32px 70px rgba(3,20,34,.32);transform:rotate(1.5deg)}.hero-photo-frame:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 8px rgba(255,255,255,.05);pointer-events:none}.hero-photo{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(.98) contrast(1.02)}.hero-photo-caption{position:absolute;z-index:4;left:0;bottom:8px;display:flex;align-items:center;gap:12px;max-width:390px;padding:14px 17px;border-radius:17px;background:rgba(255,255,255,.96);color:var(--deep);box-shadow:0 18px 42px rgba(3,20,34,.24);backdrop-filter:blur(12px)}.hero-photo-caption-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f3d39d,#d6a75e);font-size:18px;flex:0 0 38px}.hero-photo-caption strong{display:block;font-size:15px;line-height:1.25}.hero-photo-caption small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:3px}.hero-photo-badge{position:absolute;z-index:5;display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:999px;background:rgba(13,43,66,.88);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 30px rgba(3,20,34,.22);backdrop-filter:blur(10px);font-size:12.5px;font-weight:750;color:#fff}.hero-photo-badge-a{right:0;top:4px}.hero-photo-badge-b{right:5px;bottom:68px}.hero-photo-shell:before{content:"";position:absolute;z-index:1;width:86px;height:86px;border:1px solid rgba(255,255,255,.2);border-radius:26px;left:4px;top:24px;transform:rotate(18deg)}
@media(max-width:900px){.hero-photo-shell{min-height:380px;padding:18px 8px 54px}.hero-photo-frame{width:min(94%,500px);border-radius:24px;transform:none}.hero-photo-caption{left:4%;right:4%;max-width:none}.hero-photo-badge-a{right:1%;top:0}.hero-photo-badge-b{right:2%;bottom:76px}}
@media(max-width:520px){.hero-photo-shell{min-height:320px}.hero-photo-frame{aspect-ratio:4/3}.hero-photo-badge{display:none}.hero-photo-caption{padding:11px 13px}.hero-photo-caption small{font-size:10.5px}}
EOF
          fi
          rm -f .github/workflows/add-photo-styles.yml
      - name: Commit styles
        run: |
          git config user.name ruslanovna01-dev
          git config user.email ruslanovna01@gmail.com
          git add -A
          git commit -m 'Style homepage profile photo' || exit 0
          git push
