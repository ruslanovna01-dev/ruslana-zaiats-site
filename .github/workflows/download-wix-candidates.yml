name: Download Wix photo candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-wix-candidates.yml'
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Download candidate images and build contact sheet
        run: |
          python - <<'PY'
          import os, urllib.request
          from PIL import Image, ImageOps, ImageDraw
          urls = {
            '01_d96.jpg':'https://static.wixstatic.com/media/1de12e_d96ff6cafd454f7c82e7788a57fe2b62~mv2.jpg',
            '02_8940_000.jpg':'https://static.wixstatic.com/media/1de12e_8940cee5cb9447348313b538817d2a98f000.jpg',
            '03_91d_002.jpg':'https://static.wixstatic.com/media/1de12e_91d594f10b65461889169f5cf755f153f002.jpg',
            '04_ad1.jpg':'https://static.wixstatic.com/media/ad1c1cbd09a2c7c47bdde4335199e4dc.jpg',
            '05_e99.png':'https://static.wixstatic.com/media/e99b4e_bf94c34e6e814b9f84eb5fba388d18a1.png',
            '06_620d.jpg':'https://static.wixstatic.com/media/1de12e_620d0b15476e4b1887d04329919c80ef~mv2.jpg',
            '07_968a9.jpg':'https://static.wixstatic.com/media/1de12e_968a9f1dd7c146dea92389ebede3e11c~mv2.jpg',
            '08_19eaea.jpg':'https://static.wixstatic.com/media/1de12e_19eaea012d8a40fbb1b144f307b5e511~mv2.jpg',
            '09_pencil.png':'https://static.wixstatic.com/media/2d61d965a8fd4e8da44d2a72e0b7ee86.png',
            '10_9248.jpg':'https://static.wixstatic.com/media/1de12e_9248a93accaf4514a5b41e875ba21131f000.jpg',
            '11_2d295.jpg':'https://static.wixstatic.com/media/1de12e_2d295a3c7eeb45a29b13ee544323f8e4f000.jpg',
            '12_da073.jpeg':'https://static.wixstatic.com/media/1de12e_da07318079ed43ddb71ff648efa5cdd5~mv2.jpeg',
            '13_8940_002.jpg':'https://static.wixstatic.com/media/1de12e_8940cee5cb9447348313b538817d2a98f002.jpg',
            '14_8940_001.jpg':'https://static.wixstatic.com/media/1de12e_8940cee5cb9447348313b538817d2a98f001.jpg',
            '15_8940_003.jpg':'https://static.wixstatic.com/media/1de12e_8940cee5cb9447348313b538817d2a98f003.jpg',
            '16_91d_000.jpg':'https://static.wixstatic.com/media/1de12e_91d594f10b65461889169f5cf755f153f000.jpg',
            '17_91d_001.jpg':'https://static.wixstatic.com/media/1de12e_91d594f10b65461889169f5cf755f153f001.jpg',
            '18_91d_003.jpg':'https://static.wixstatic.com/media/1de12e_91d594f10b65461889169f5cf755f153f003.jpg'
          }
          os.makedirs('wix-candidates',exist_ok=True)
          ok=[]
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read()
              path='wix-candidates/'+name
              open(path,'wb').write(data)
              im=Image.open(path); im.load()
              print(name, im.size, im.mode)
              ok.append((name,path,im.size))
            except Exception as e: print('FAIL',name,e)
          tilew,tileh=360,320
          cols=3
          rows=(len(ok)+cols-1)//cols
          sheet=Image.new('RGB',(cols*tilew,max(rows,1)*tileh),'white')
          draw=ImageDraw.Draw(sheet)
          for i,(name,path,size) in enumerate(ok):
            im=Image.open(path).convert('RGB')
            thumb=ImageOps.contain(im,(340,260))
            x=(i%cols)*tilew+(tilew-thumb.width)//2
            y=(i//cols)*tileh+10
            sheet.paste(thumb,(x,y))
            draw.text(((i%cols)*tilew+10,(i//cols)*tileh+275),f'{name}  {size[0]}x{size[1]}',fill='black')
          sheet.save('wix-candidates/contact-sheet.jpg',quality=88)
          PY
      - name: Commit candidates
        run: |
          git config user.name 'ruslanovna01-dev'
          git config user.email 'ruslanovna01@gmail.com'
          git add wix-candidates
          git commit -m 'Download Wix photo candidates' || exit 0
          git push
