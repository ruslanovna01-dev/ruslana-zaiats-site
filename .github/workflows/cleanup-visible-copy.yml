name: Cleanup visitor-facing copy
on:
  push:
    paths:
      - '.github/workflows/cleanup-visible-copy.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean technical wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          replacements = {
            'Зображення документів, для яких доступне прев’ю, показані безпосередньо на сторінці. Натискання відкриває оригінал у повному розмірі. Для PDF, HEIC та інших файлів без стабільного прев’ю використано позначку документа й посилання на перегляд.': 'Професійні відзнаки, документи про підвищення кваліфікації та результати участі у професійних заходах.',
            'Документи відкриваються у режимі перегляду. Матеріали, що містять службові або персональні дані, на публічний сайт не виносяться.': 'Методичні матеріали та професійні напрацювання.',
            'PDF-публікація з професійного портфоліо.': 'Публікація з професійного портфоліо.',
            'Google Docs • читання на сайті': 'Документ',
            'PDF • читання на сайті': 'Документ',
            'ОК16 • read-only': 'ОК16',
            'ОК17 • read-only': 'ОК17',
            'Наповнений веб-розділ': 'Навчальний матеріал',
            'Веб-матеріал': 'Навчальний матеріал',
            'Веб-структура': 'Навчальні матеріали',
            'Чинний розділ ОК16': 'Навчальний розділ',
            'Чинний розділ ОК17': 'Навчальний розділ',
            'Наповнений розділ': 'Навчальний розділ',
            'Наповнений навчальний матеріал': 'Навчальний матеріал',
            'Режим читання через переглядач сайту.': 'Матеріал для опрацювання.',
            'Відкривається всередині сайту без переходу в режим редагування.': 'Матеріал для опрацювання.',
            'Документи відкриваються у вбудованому переглядачі сайту. Редагування з інтерфейсу сайту не передбачено.': 'Оберіть потрібний матеріал.',
            'Файли відкриваються як матеріали для перегляду. На публічній сторінці немає ключів відповідей, службових Google Forms-скриптів і внутрішніх контрольних файлів.': '',
            'Натисни на потрібну роботу — відкриється відповідний Google-документ у режимі перегляду.': 'Оберіть потрібну роботу.',
            'Натисни на конкретну лекцію — відкриється відповідний Google-документ у режимі перегляду.': 'Оберіть потрібну лекцію.',
            'Натисни на конкретний семінар — відкриється відповідний Google-документ у режимі перегляду.': 'Оберіть потрібне семінарське заняття.',
            'Натисни на потрібну самостійну роботу — відкриється відповідний Google-документ у режимі перегляду.': 'Оберіть потрібну самостійну роботу.'
          }
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              old = s
              for a,b in replacements.items(): s=s.replace(a,b)
              s = re.sub(r'<div class="note"><strong>Фактично підключено:</strong>.*?</div>', '', s, flags=re.S)
              s = re.sub(r'<div class="note"><strong>Статус наповнення:</strong>.*?</div>', '', s, flags=re.S)
              s = re.sub(r'<div class="note">Кожна картка тепер веде на реальний файл Google Docs, а не на внутрішню сторінку сайту\.</div>', '', s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'site-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet || git commit -m 'Clean technical wording from visitor pages'
          git push
